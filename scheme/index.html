<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <style>:root{color-scheme:dark}html,body{background:#110f1f;color:#ece9ff}</style>
  <!-- /scheme/ is the old address of /diagrams/. GitHub Pages cannot answer with a 301, so this page
       stands in for one: search engines read the instant refresh and the canonical as a permanent
       move, and the script keeps a #scheme= deep link (the app still reads it). -->
  <script>location.replace('/diagrams/' + location.search + location.hash);</script>
  <meta http-equiv="refresh" content="0; url=/diagrams/">
  <link rel="canonical" href="https://kube.how/diagrams/">
  <title>Moved to kube.how/diagrams/</title>
</head>
<body>
  <p>Kubernetes Diagrams moved to <a href="/diagrams/">kube.how/diagrams/</a>.</p>
</body>
</html>
