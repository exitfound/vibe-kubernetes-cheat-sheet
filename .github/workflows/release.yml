name: Create Release

# Called by deploy.yml once its verify passes, so a push to main is verified once, not twice.
on:
  workflow_call:

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  # Docs-only pushes cut no release. The list is the zip below plus the container files and the
  # generator, and a push it cannot compare (a new branch, a rewritten history) releases anyway.
  changes:
    name: Shipped files changed
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      ship: ${{ steps.diff.outputs.ship }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compare with the previous head
        id: diff
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -z "$BEFORE" ] || [ "$BEFORE" = 0000000000000000000000000000000000000000 ] \
            || ! git fetch --quiet --depth=1 origin "$BEFORE"; then
            echo "ship=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git diff --quiet "$BEFORE" "$GITHUB_SHA" -- index.html 404.html cli diagrams images scheme \
            favicon.svg favicon.ico robots.txt CNAME Dockerfile compose.yaml configs .dockerignore \
            tools/pages .github/workflows/release.yml; then
            echo "ship=false" >> "$GITHUB_OUTPUT"
          else
            echo "ship=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    name: Create Release
    needs: changes
    if: needs.changes.outputs.ship == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Generate version
        id: version
        run: echo "VERSION=v$(date -u +'%Y.%m.%d')-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Generate release body
        run: echo "# $(date -u +'%Y/%m/%d')" > release_body.txt

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Build static pages
        run: node tools/pages/build.mjs

      - name: Package source
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          zip -r "kube-cheatsheet-${VERSION}.zip" \
            index.html \
            404.html \
            cli/ \
            diagrams/ \
            images/ \
            scheme/ \
            favicon.svg \
            favicon.ico \
            robots.txt \
            sitemap.xml \
            llms.txt \
            CNAME \
            Dockerfile \
            compose.yaml \
            configs/ \
            .dockerignore \
            -x "diagrams/test/*" "*CLAUDE.md" "*CARDS.md" "*CANON.md" "*README.md" "*README.ru.md" "*/CARDS/*"

      - name: Create Release on GitHub
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          gh release create "$VERSION" "kube-cheatsheet-${VERSION}.zip" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "$VERSION" --notes-file release_body.txt
