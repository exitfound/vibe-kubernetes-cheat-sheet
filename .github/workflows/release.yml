name: Create Release

on:
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - '404.html'
      - 'cli/**'
      - 'diagrams/**'
      - 'images/**'
      - 'favicon.svg'
      - 'favicon.ico'
      - 'robots.txt'
      - 'CNAME'
      - 'Dockerfile'
      - 'configs/**'
      - '.dockerignore'
      - 'tools/pages/**'
      - '.github/workflows/release.yml'

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/verify.yml

  release:
    name: Create Release
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate version
        id: version
        run: echo "VERSION=v$(date +'%Y.%m.%d')-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Generate release body
        run: echo "# $(date +'%Y/%m/%d')" > release_body.txt

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build static pages
        run: node tools/pages/build.mjs

      - name: Package source
        run: |
          zip -r kube-cheatsheet-${{ steps.version.outputs.VERSION }}.zip \
            index.html \
            404.html \
            cli/ \
            diagrams/ \
            images/ \
            favicon.svg \
            favicon.ico \
            robots.txt \
            sitemap.xml \
            llms.txt \
            CNAME \
            Dockerfile \
            configs/ \
            .dockerignore \
            -x "diagrams/test/*" "*CLAUDE.md" "*CARDS.md" "*CANON.md" "*/CARDS/*"

      - name: Create Release on Github
        uses: softprops/action-gh-release@v2
        with:
          repository: exitfound/vibe-kubernetes-cheat-sheet
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ steps.version.outputs.VERSION }}
          name: ${{ steps.version.outputs.VERSION }}
          body_path: release_body.txt
          files: kube-cheatsheet-${{ steps.version.outputs.VERSION }}.zip
