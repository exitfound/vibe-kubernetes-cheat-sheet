name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  verify:
    permissions:
      contents: read
    uses: ./.github/workflows/verify.yml

  # The source zip, after the same verify. It decides for itself whether the push changed what ships.
  release:
    needs: verify
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml

  deploy:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Build static pages
        run: node tools/pages/build.mjs

      # The allowlist and the internal-doc exclusion live in one script, which verify.yml runs too.
      - name: Stage site
        run: tools/deploy/stage.sh _site

      - name: Stamp asset URLs
        run: node tools/deploy/version.mjs _site "${GITHUB_SHA::8}"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
