<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="230" viewBox="0 0 1200 230" role="img" aria-labelledby="title desc">
  <title id="title">kube.how Diagrams</title>
  <desc id="desc">The Diagrams app at kube.how/diagrams: animated SVG diagrams of how Kubernetes works, in four categories with their own colours: Cluster, Workloads, Networking and Storage.</desc>

  <defs>
    <marker id="head-net" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#4fe5ff"/>
    </marker>
  </defs>

  <rect width="1200" height="230" rx="22" fill="#110f1f"/>
  <rect x="0.5" y="0.5" width="1199" height="229" rx="21.5" fill="none" stroke="#2e274e"/>

  <g id="title-block" transform="translate(56 0)">
    <rect x="0" y="52" width="64" height="56" rx="12" fill="#1a1538" stroke="#7d86ff" stroke-width="2"/>
    <rect x="12" y="66" width="17" height="15" rx="3" fill="none" stroke="#e0cdff" stroke-width="2.6"/>
    <rect x="35" y="80" width="17" height="15" rx="3" fill="none" stroke="#e0cdff" stroke-width="2.6"/>
    <path d="M29 74 L35 87" stroke="#e0cdff" stroke-width="2.6" stroke-linecap="round"/>
    <circle cx="32" cy="80.5" r="3" fill="#e0cdff"/>
    <text x="88" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="50" font-weight="700" letter-spacing="-0.5" fill="#f9f8ff">Diagrams</text>
    <text x="0" y="148" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" fill="#c7c2ed">How Kubernetes works, one step at a time.</text>
    <text x="0" y="184" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="18" fill="#9b95b8">kube.how/diagrams</text>
  </g>

  <g id="tiles" transform="translate(12 0)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="17" text-anchor="middle">
    <g id="cluster">
      <rect x="628" y="34" width="117" height="162" rx="10" fill="#1a1538" stroke="#7d86ff" stroke-opacity="0.6" stroke-width="1.5"/>
      <g fill="none" stroke="#7d86ff" stroke-width="1.8">
        <rect x="660" y="56" width="52" height="22" rx="4"/>
        <rect x="642" y="108" width="36" height="20" rx="4"/>
        <rect x="694" y="108" width="36" height="20" rx="4"/>
        <path d="M676 78 V96 H660 V108 M696 78 V96 H712 V108" stroke-dasharray="4 3"/>
      </g>
      <text x="686.5" y="176" fill="#ece9ff">Cluster</text>
    </g>
    <g id="workloads">
      <rect x="757" y="34" width="117" height="162" rx="10" fill="#1a1538" stroke="#5bb8ff" stroke-opacity="0.6" stroke-width="1.5"/>
      <g fill="none" stroke="#5bb8ff" stroke-width="1.8">
        <rect x="785" y="54" width="60" height="22" rx="4"/>
        <rect x="785" y="82" width="60" height="22" rx="4"/>
        <rect x="785" y="110" width="60" height="22" rx="4" stroke="#e0cdff"/>
      </g>
      <text x="815.5" y="176" fill="#ece9ff">Workloads</text>
    </g>
    <g id="networking">
      <rect x="886" y="34" width="117" height="162" rx="10" fill="#1a1538" stroke="#4fe5ff" stroke-opacity="0.6" stroke-width="1.5"/>
      <g fill="none" stroke="#4fe5ff" stroke-width="1.8">
        <rect x="900" y="80" width="30" height="26" rx="4"/>
        <rect x="959" y="80" width="30" height="26" rx="4"/>
        <path d="M930 93 H957" stroke-dasharray="4 3" marker-end="url(#head-net)"/>
      </g>
      <circle cx="943" cy="93" r="4.5" fill="#e0cdff"/>
      <text x="944.5" y="176" fill="#ece9ff">Networking</text>
    </g>
    <g id="storage">
      <rect x="1015" y="34" width="117" height="162" rx="10" fill="#1a1538" stroke="#5eca94" stroke-opacity="0.6" stroke-width="1.5"/>
      <g fill="none" stroke="#5eca94" stroke-width="1.8">
        <path d="M1050 66 V118 A23.5 7 0 0 0 1097 118 V66"/>
        <ellipse cx="1073.5" cy="66" rx="23.5" ry="7"/>
        <path d="M1050 92 A23.5 7 0 0 0 1097 92"/>
      </g>
      <text x="1073.5" y="176" fill="#ece9ff">Storage</text>
    </g>
  </g>
</svg>
