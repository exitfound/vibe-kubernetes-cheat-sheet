server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Hide nginx version
    server_tokens off;

    # The directory redirect (/diagrams -> /diagrams/) keeps the browser's host and port. An absolute
    # redirect would name port 80, the one nginx listens on inside the container, not the mapped one.
    absolute_redirect off;

    charset utf-8;
    charset_types text/css text/plain text/xml application/javascript application/json application/xml image/svg+xml;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

    # Gzip compression (text/html is always compressed and must not be listed)
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        text/css
        text/plain
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        image/x-icon;

    # Static assets: no cache, for local dev iteration. Production (GitHub Pages) sets its own policy.
    # `merge` keeps the server-level headers in this block (without it a block's add_header drops them).
    location ~* \.(css|js|json|svg|png|jpg|ico|woff2?|html|xml|txt)$ {
        add_header_inherit merge;
        add_header Cache-Control "no-cache" always;
    }

    # A dotfile that reaches the image by accident is never served.
    location ~ /\. {
        return 404;
    }

    # A miss gets the site's own not-found page, as GitHub Pages serves it in production.
    error_page 404 /404.html;

    location / {
        try_files $uri $uri/ =404;
    }
}
