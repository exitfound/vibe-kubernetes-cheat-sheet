  <script>
    // Russian for the static chrome, swapped in before the first paint. [data-ru] replaces the inner
    // HTML, [data-ru-tooltip|label|title|placeholder] that attribute, and the English is kept beside
    // it as data-en*. One snippet on the four pages, same key, event and font as cli/js/lib/lang.js.
    (function () {
      const PARTS = [['ru', 'en', null], ['ruTooltip', 'enTooltip', 'data-tooltip'], ['ruLabel', 'enLabel', 'aria-label'],
        ['ruTitle', 'enTitle', 'title'], ['ruPlaceholder', 'enPlaceholder', 'placeholder']];
      const els = document.querySelectorAll('[data-ru], [data-ru-tooltip], [data-ru-label], [data-ru-title], [data-ru-placeholder]');
      els.forEach(el => PARTS.forEach(([ru, en, attr]) => {
        if (el.dataset[ru] != null) el.dataset[en] = attr ? el.getAttribute(attr) : el.innerHTML;
      }));
      const apply = (lang) => els.forEach(el => PARTS.forEach(([ru, en, attr]) => {
        if (el.dataset[ru] == null) return;
        const v = el.dataset[lang === 'ru' ? ru : en];
        if (attr) el.setAttribute(attr, v); else el.innerHTML = v;
        if (lang === 'ru') el.lang = 'ru'; else el.removeAttribute('lang');
      }));
      let lang = 'en';
      try { if (localStorage.getItem('kube-how:lang:v1') === 'ru') lang = 'ru'; } catch (_) {}
      if (lang === 'ru') {
        apply(lang);
        // Onest for the Cyrillic, asked for here, not once the modules run after parsing.
        const font = document.createElement('link');
        font.rel = 'stylesheet';
        font.href = 'https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap';
        document.head.append(font);
      }
      window.addEventListener('kube-how:lang', (e) => apply(e.detail));
    })();
  </script>
